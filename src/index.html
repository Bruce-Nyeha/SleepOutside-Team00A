<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />

    <script type="module" src="/js/main.js"></script>
  </head>

  <body>
    <header class="divider" id="dynamic-header"></header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner-sm.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <div class="categories">
        <a href="/product_listing/index.html?category=tents" class="category">
          <img src="/public/images/categories/category-tents.svg" alt="Tents" />
          <span>Tents</span>
        </a>

        <a
          href="/product_listing/index.html?category=backpacks"
          class="category"
        >
          <img
            src="/public/images/categories/category-backpacks.svg"
            alt="Backpacks"
          />
          <span>Backpacks</span>
        </a>

        <a
          href="/product_listing/index.html?category=sleeping-bags"
          class="category"
        >
          <img
            src="/public/images/categories/category-sleepingbags.svg"
            alt="Sleeping Bags"
          />
          <span>Sleeping Bags</span>
        </a>

        <a
          href="/product_listing/index.html?category=hammocks"
          class="category"
        >
          <img
            src="/public/images/categories/category-hammocks.svg"
            alt="Hammocks"
          />
          <span>Hammocks</span>
        </a>
      </div>

      <section class="products">
        <h2>Top Products</h2>
        <div class="sort-container">
          <label for="sort">Sort by:</label>
          <select id="sort-select">
            <option value="">Select</option>
            <option value="name-asc">Name (A-Z)</option>
            <option value="name-desc">Name (Z-A)</option>
            <option value="price-asc">Price (Low to High)</option>
            <option value="price-desc">Price (High to Low)</option>
          </select>
        </div>
        <ul class="product-list"></ul>
      </section>
    </main>
    <footer id="dynamic-footer"></footer>
  </body>
</html>
