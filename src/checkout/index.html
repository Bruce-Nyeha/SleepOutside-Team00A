<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>

    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="dynamic-header"></header>

    <main class="divider">
      <h2>Review & Place your Order</h2>
      <section class="checkout-section">
        <form id="checkout">
          <fieldset>
            <legend>Personal Information</legend>
            <label for="fname">First Name</label>
            <input type="text" id="fname" name="fname" required />

            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lname" required />
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>
            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required />

            <label for="city">City</label>
            <input type="text" id="city" name="city" required />

            <label for="state">State</label>
            <input type="text" id="state" name="state" required />

            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip" required />
          </fieldset>

          <fieldset>
            <legend>Payment Details</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" required />

            <label for="expiration">Expiration Date</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              placeholder="MM/YY"
              required
            />

            <label for="code">Security Code</label>
            <input type="text" id="code" name="code" required />
          </fieldset>

          <fieldset>
            <legend>Order Summary</legend>
            <div>Items: <span id="num-items"></span></div>
            <div>Subtotal: <span id="total-cart"></span></div>
            <div>Tax: <span id="tax"></span></div>
            <div>Shipping: <span id="shipping"></span></div>
            <div>Total: <span id="orderTotal"></span></div>
          </fieldset>

          <button type="submit" id="checkout-button">Checkout</button>
        </form>
      </section>
    </main>

    <footer id="dynamic-footer"></footer>
  </body>
</html>
